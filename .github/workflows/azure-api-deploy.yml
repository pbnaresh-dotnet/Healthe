name: Deploy HealthApp API to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - feature/standalone-saas
    paths:
      - 'backend/**'
      - '.github/workflows/azure-api-deploy.yml'

env:
  AZURE_WEBAPP_NAME: broccoly
  DOTNET_VERSION: '10.x'
  PROJECT_PATH: backend/src/HealthApp.Api/HealthApp.Api.csproj
  SOLUTION_PATH: backend/HealthApp.sln

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-build -o ${{ github.workspace }}/publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
