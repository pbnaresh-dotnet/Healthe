name: Deploy HealthApp Frontends to Cloudflare (Standalone)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Frontend to deploy
        required: true
        type: choice
        options:
          - all
          - customer
          - outlet
          - admin
          - broccoly
        default: all

env:
  NODE_VERSION: '22'
  API_BASE_URL: 'https://api.broccoly.in/api'
  OUTLET_APP_URL: 'https://app.broccoly.in'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: frontend/healthapp-saas

    steps:
      - name: Checkout standalone branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Deploy customer
        if: inputs.app == 'customer' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          echo "Building customer with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          npm run build:customer
          npx wrangler@4 deploy --config apps/customer-web/wrangler.jsonc

      - name: Deploy outlet
        if: inputs.app == 'outlet' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_BROCCOLY_URL: 'https://broccoly.in'
        run: |
          echo "Building outlet with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          npm run build:outlet
          npx wrangler@4 deploy --config apps/outlet-web/wrangler.jsonc

      - name: Deploy admin
        if: inputs.app == 'admin' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          echo "Building admin with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          npm run build:admin
          npx wrangler@4 deploy --config apps/admin-web/wrangler.jsonc

      - name: Deploy Broccoly
        if: inputs.app == 'broccoly' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
          VITE_OUTLET_APP_URL: ${{ env.OUTLET_APP_URL }}
        run: |
          echo "Building Broccoly with VITE_API_BASE_URL=${VITE_API_BASE_URL}"
          npm run build:broccoly
          npx wrangler@4 deploy --config apps/broccoly-web/wrangler.jsonc
