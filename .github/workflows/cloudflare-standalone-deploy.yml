name: Deploy HealthApp Frontends to Cloudflare (Standalone)

on:
  workflow_dispatch:
    inputs:
      app:
        description: Frontend to deploy
        required: true
        type: choice
        options:
          - all
          - customer
          - outlet
          - admin
        default: all

env:
  NODE_VERSION: '22'
  API_BASE_URL: 'https://api.broccoly.in/api'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend/healthapp-saas

    steps:
      - name: Checkout standalone branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/healthapp-saas/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Deploy customer
        if: inputs.app == 'customer' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm run build:customer
          npx wrangler@4 pages deploy apps/customer-web/dist --project-name healthapp-customer

      - name: Deploy outlet
        if: inputs.app == 'outlet' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm run build:outlet
          npx wrangler@4 pages deploy apps/outlet-web/dist --project-name healthapp-outlet

      - name: Deploy admin
        if: inputs.app == 'admin' || inputs.app == 'all'
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm run build:admin
          npx wrangler@4 pages deploy apps/admin-web/dist --project-name healthapp-admin
